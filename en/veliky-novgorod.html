<h1>Veliky Novgorod: a pleasant city for designers</h1>
<p class="caption">Viewed in 1 day</p>
</div>
</div>
<div class="project-gallery">
<ids-gallery>
<figure>
<a data-pswp-height="1280" data-pswp-width="960" href="../images/travels/veliky-novgorod/veliky-novgorod-1.avif">
<img alt="Veliky Novgorod, image 1" decoding="async" height="1280" loading="lazy" src="../images/travels/veliky-novgorod/veliky-novgorod-1.avif" width="960"/>
</a>
<p class="caption">A beautiful punk sign for an orthopedic salon. If you change a font from the 00s to a font from the 90s, you get a design by Lebedev studio</p>
</figure>
<figure>
<a data-pswp-height="1280" data-pswp-width="960" href="../images/travels/veliky-novgorod/veliky-novgorod-2.avif">
<img alt="Veliky Novgorod, image 2" decoding="async" height="1280" loading="lazy" src="../images/travels/veliky-novgorod/veliky-novgorod-2.avif" width="960"/>
</a>
<p class="caption">Beautiful (red) flags. It would seem that they didn’t try to do anything with this dash from Y. They bully her this way and that. Just like above the letter O in logos. But then it worked out - a stick, a circular composition and a loading icon. Technology Championship after all</p>
</figure>
<figure>
<a data-pswp-height="1280" data-pswp-width="960" href="../images/travels/veliky-novgorod/veliky-novgorod-3.avif">
<img alt="Veliky Novgorod, image 3" decoding="async" height="1280" loading="lazy" src="../images/travels/veliky-novgorod/veliky-novgorod-3.avif" width="960"/>
</a>
<p class="caption">Post-meta giga-punk. They are so into the nostalgia trend that they have Sberbank</p>
</figure>
<figure>
<a data-pswp-height="1280" data-pswp-width="960" href="../images/travels/veliky-novgorod/veliky-novgorod-4.avif">
<img alt="Veliky Novgorod, image 4" decoding="async" height="1280" loading="lazy" src="../images/travels/veliky-novgorod/veliky-novgorod-4.avif" width="960"/>
</a>
<p class="caption">I think we can guess where dad is</p>
</figure>
<figure>
<a data-pswp-height="1280" data-pswp-width="960" href="../images/travels/veliky-novgorod/veliky-novgorod-5.avif">
<img alt="Veliky Novgorod, image 5" decoding="async" height="1280" loading="lazy" src="../images/travels/veliky-novgorod/veliky-novgorod-5.avif" width="960"/>
</a>
<p class="caption">Ideal barista for 0₽. We wanted to compliment employees and add value to customers. And it turned out to be the cheapest item on the menu</p>
</figure>
<figure>
<a data-pswp-height="1280" data-pswp-width="960" href="../images/travels/veliky-novgorod/veliky-novgorod-6.avif">
<img alt="Veliky Novgorod, image 6" decoding="async" height="1280" loading="lazy" src="../images/travels/veliky-novgorod/veliky-novgorod-6.avif" width="960"/>
</a>
<p class="caption">Again, someone is opening a business in my last name...</p>
</figure>
<figure>
<a data-pswp-height="1280" data-pswp-width="960" href="../images/travels/veliky-novgorod/veliky-novgorod-7.avif">
<img alt="Veliky Novgorod, image 7" decoding="async" height="1280" loading="lazy" src="../images/travels/veliky-novgorod/veliky-novgorod-7.avif" width="960"/>
</a>
<p class="caption">A lawn to walk on...</p>
</figure>
<figure>
<a data-pswp-height="1280" data-pswp-width="960" href="../images/travels/veliky-novgorod/veliky-novgorod-8.avif">
<img alt="Veliky Novgorod, image 8" decoding="async" height="1280" loading="lazy" src="../images/travels/veliky-novgorod/veliky-novgorod-8.avif" width="960"/>
</a>
<p class="caption">And why it’s impossible</p>
</figure>
<figure>
<a data-pswp-height="1280" data-pswp-width="960" href="../images/travels/veliky-novgorod/veliky-novgorod-9.avif">
<img alt="Veliky Novgorod, image 9" decoding="async" height="1280" loading="lazy" src="../images/travels/veliky-novgorod/veliky-novgorod-9.avif" width="960"/>
</a>
<p class="caption">Unfortunately, the most beautiful building was under reconstruction</p>
</figure>
<figure>
<a data-pswp-height="1280" data-pswp-width="960" href="../images/travels/veliky-novgorod/veliky-novgorod-10.avif">
<img alt="Veliky Novgorod, image 10" decoding="async" height="1280" loading="lazy" src="../images/travels/veliky-novgorod/veliky-novgorod-10.avif" width="960"/>
</a>
<p class="caption">But around this building there was still the most beautiful covering of the square. Kusama likes</p>
</figure>
<figure>
<a data-pswp-height="960" data-pswp-width="1280" href="../images/travels/veliky-novgorod/veliky-novgorod-11.avif">
<img alt="Veliky Novgorod, image 11" decoding="async" height="960" loading="lazy" src="../images/travels/veliky-novgorod/veliky-novgorod-11.avif" width="1280"/>
</a>
<p class="caption">There are many beautiful murals throughout the city</p>
</figure>
<figure>
<a data-pswp-height="960" data-pswp-width="1280" href="../images/travels/veliky-novgorod/veliky-novgorod-12.avif">
<img alt="Veliky Novgorod, image 12" decoding="async" height="960" loading="lazy" src="../images/travels/veliky-novgorod/veliky-novgorod-12.avif" width="1280"/>
</a>
<p class="caption">The city itself is small. All iconic places are nearby. Therefore, one minute from the station there is a mural with a tourist map of the entire city. Beautiful</p>
</figure>
<figure>
<a data-pswp-height="960" data-pswp-width="1280" href="../images/travels/veliky-novgorod/veliky-novgorod-13.avif">
<img alt="Veliky Novgorod, image 13" decoding="async" height="960" loading="lazy" src="../images/travels/veliky-novgorod/veliky-novgorod-13.avif" width="1280"/>
</a>
<p class="caption">CSS is hard. These are restored windows on the territory of the Kremlin. We couldn't understand why they are like this</p>
</figure>
<figure>
<a data-pswp-height="1280" data-pswp-width="960" href="../images/travels/veliky-novgorod/veliky-novgorod-15.avif">
<img alt="Veliky Novgorod, image 14" decoding="async" height="1280" loading="lazy" src="../images/travels/veliky-novgorod/veliky-novgorod-15.avif" width="960"/>
</a>
<p class="caption">Monument. Yes, a circular composition with a plot and dynamics seems like an interesting solution. Especially if we know what kind of heroes they are and what historical events they show. But from my face I think everything is clear.</p>
</figure>
<figure>
<a data-pswp-height="1280" data-pswp-width="960" href="../images/travels/veliky-novgorod/veliky-novgorod-16.avif">
<img alt="Veliky Novgorod, image 15" decoding="async" height="1280" loading="lazy" src="../images/travels/veliky-novgorod/veliky-novgorod-16.avif" width="960"/>
</a>
<p class="caption">I am endlessly fascinated by the fact that in the 21st century we can read the text on a coin that is 1000 years old. I wonder how far back we can still read? 1500 years? 2000 years? 
              </p>
</figure>
<figure>
<a data-pswp-height="1280" data-pswp-width="960" href="../images/travels/veliky-novgorod/veliky-novgorod-17.avif">
<img alt="Veliky Novgorod, image 16" decoding="async" height="1280" loading="lazy" src="../images/travels/veliky-novgorod/veliky-novgorod-17.avif" width="960"/>
</a>
<p class="caption">The banner on the ruble was also created 1000 years ago. Even then, a rider on a horse and a two-headed eagle were used. (This may be a common fact, but I didn't know it)
              </p>
</figure>
<figure>
<a data-pswp-height="1280" data-pswp-width="960" href="../images/travels/veliky-novgorod/veliky-novgorod-18.avif">
<img alt="Veliky Novgorod, image 17" decoding="async" height="1280" loading="lazy" src="../images/travels/veliky-novgorod/veliky-novgorod-18.avif" width="960"/>
</a>
<p class="caption">No, it wasn’t Jean-Michel Basquiat running past. This is a drawing of a boy on birch bark, also about 1000 years ago. Enlarged several times and made of metal
              </p>
</figure>
<figure>
<a data-pswp-height="1280" data-pswp-width="960" href="../images/travels/veliky-novgorod/veliky-novgorod-19.avif">
<img alt="Veliky Novgorod, image 18" decoding="async" height="1280" loading="lazy" src="../images/travels/veliky-novgorod/veliky-novgorod-19.avif" width="960"/>
</a>
<p class="caption">There is a lot of interactive entertainment inside the museum. Volumetric letters. Quizzes. Games. Video. Projections. Most of them are really interesting. It’s clear that it wasn’t just done with passion. And with the soul of a talented person too</p>
</figure>
<figure>
<a data-pswp-height="1280" data-pswp-width="915" href="../images/travels/veliky-novgorod/veliky-novgorod-20.avif">
<img alt="Veliky Novgorod, image 19" decoding="async" height="1280" loading="lazy" src="../images/travels/veliky-novgorod/veliky-novgorod-20.avif" width="915"/>
</a>
<p class="caption"></p>
</figure>
<figure>
<a data-pswp-height="1280" data-pswp-width="915" href="../images/travels/veliky-novgorod/veliky-novgorod-21.avif">

</a>
<p class="caption">cat</p>
</figure>
