<script>
      (function () {
        const video = document.getElementById("background-video");
        const canvas = document.getElementById("background-canvas");
        const ctx = canvas && canvas.getContext("2d");
        if (!video || !ctx) return;

        const mobileQuery = window.matchMedia("(max-width: 768px)");
        let started = false;

        function resizeCanvas() {
          const viewportHeight = window.innerHeight;
          const isMobile = mobileQuery.matches;

          canvas.width = window.innerWidth;
          canvas.height = isMobile ? viewportHeight * 0.75 : viewportHeight;
          canvas.style.top = (isMobile ? viewportHeight * 0.25 : 0) + "px";
          // Resizing clears the canvas, so redraw right away (matters when the video is paused).
          drawCoverFrame();
        }

        function drawCoverFrame() {
          if (!video.videoWidth || !video.videoHeight) return;

          const scale = Math.max(
            canvas.width / video.videoWidth,
            canvas.height / video.videoHeight
          );

          const drawWidth = video.videoWidth * scale;
          const drawHeight = video.videoHeight * scale;
          const offsetX = (canvas.width - drawWidth) / 2;
          const offsetY = (canvas.height - drawHeight) / 2;

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(video, offsetX, offsetY, drawWidth, drawHeight);
        }

        // Draw only when the video has a new frame (25 fps) instead of on every screen refresh.
        function renderLoop() {
          drawCoverFrame();
          if (video.requestVideoFrameCallback) {
            video.requestVideoFrameCallback(renderLoop);
          } else {
            requestAnimationFrame(renderLoop);
          }
        }

        function start() {
          if (started) return;
          started = true;
          video.play().catch(function () {});
          renderLoop();
        }

        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);
        if (video.readyState >= 2) {
          start();
        } else {
          video.addEventListener("loadeddata", start, { once: true });
        }
      })();
    </script>
