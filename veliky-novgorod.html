            <h1>Великий Новгород: приятный город для дизайнеров</h1>       
            <p class="caption">Посмотрено за 1 день</p>              

          </div>

        </div>
        <div class="project-gallery">
          <ids-gallery>
            <figure>
              <a href="images/travels/veliky-novgorod/veliky-novgorod-1.avif" data-pswp-width="960" data-pswp-height="1280">
                <img alt="Великий Новгород, изображение 1" src="images/travels/veliky-novgorod/veliky-novgorod-1.avif" width="960" height="1280" loading="lazy" decoding="async">
              </a>
              <p class="caption">Красивая панковская вывеска ортопедического салона. Если шрифт из 00х поменять на шрифт из 90х, получится дизайн студии Лебедева</p>
            </figure>
            <figure>
              <a href="images/travels/veliky-novgorod/veliky-novgorod-2.avif" data-pswp-width="960" data-pswp-height="1280">
                <img alt="Великий Новгород, изображение 2" src="images/travels/veliky-novgorod/veliky-novgorod-2.avif" width="960" height="1280" loading="lazy" decoding="async">
              </a>
              <p class="caption">Красивые (рэд)флаги. Казалось бы, что только не пытались сделать с этой чёрточкой от Ы. И так, и сяк над ней издеваются. Так же как и над буквой О в логотипах. Но тут сложилось — палочка, круговая композиция и иконка загрузки. Чемпионат технологий всё таки</p>
            </figure>

            <figure>
              <a href="images/travels/veliky-novgorod/veliky-novgorod-3.avif" data-pswp-width="960" data-pswp-height="1280">
                <img alt="Великий Новгород, изображение 3" src="images/travels/veliky-novgorod/veliky-novgorod-3.avif" width="960" height="1280" loading="lazy" decoding="async">
              </a>
              <p class="caption">Пост-мета-гига-панк. Они настолько в тренде на ностальгию, что у них «Сбербанк»</p>
            </figure>

            <figure>
              <a href="images/travels/veliky-novgorod/veliky-novgorod-4.avif" data-pswp-width="960" data-pswp-height="1280">
                <img alt="Великий Новгород, изображение 4" src="images/travels/veliky-novgorod/veliky-novgorod-4.avif" width="960" height="1280" loading="lazy" decoding="async">
              </a>
              <p class="caption">Мне кажется, мы догадываемся, где папа</p>
            </figure>
            <figure>
              <a href="images/travels/veliky-novgorod/veliky-novgorod-5.avif" data-pswp-width="960" data-pswp-height="1280">
                <img alt="Великий Новгород, изображение 5" src="images/travels/veliky-novgorod/veliky-novgorod-5.avif" width="960" height="1280" loading="lazy" decoding="async">
              </a>
              <p class="caption">Идеальный бариста за 0₽. Хотели сделать комплимент работникам и увеличить ценность для покупателей. А получилась самая дешёвая позиция в меню</p>
            </figure>

            <figure>
              <a href="images/travels/veliky-novgorod/veliky-novgorod-6.avif" data-pswp-width="960" data-pswp-height="1280">
                <img alt="Великий Новгород, изображение 6" src="images/travels/veliky-novgorod/veliky-novgorod-6.avif" width="960" height="1280" loading="lazy" decoding="async">
              </a>
              <p class="caption">Опять кто-то на мою фамилию открывает бизнес…</p>
            </figure>

            <figure>
              <a href="images/travels/veliky-novgorod/veliky-novgorod-7.avif" data-pswp-width="960" data-pswp-height="1280">
                <img alt="Великий Новгород, изображение 7" src="images/travels/veliky-novgorod/veliky-novgorod-7.avif" width="960" height="1280" loading="lazy" decoding="async">
              </a>
              <p class="caption">Газон, по которому можно ходить…</p>
            </figure>

            <figure>
              <a href="images/travels/veliky-novgorod/veliky-novgorod-8.avif" data-pswp-width="960" data-pswp-height="1280">
                <img alt="Великий Новгород, изображение 8" src="images/travels/veliky-novgorod/veliky-novgorod-8.avif" width="960" height="1280" loading="lazy" decoding="async">
              </a>
              <p class="caption">И по которому нельзя</p>
            </figure>

            <figure>
              <a href="images/travels/veliky-novgorod/veliky-novgorod-9.avif" data-pswp-width="960" data-pswp-height="1280">
                <img alt="Великий Новгород, изображение 9" src="images/travels/veliky-novgorod/veliky-novgorod-9.avif" width="960" height="1280" loading="lazy" decoding="async">
              </a>
              <p class="caption">К сожалению, самое красивое здание было на реконструкции</p>
            </figure>

            <figure>
              <a href="images/travels/veliky-novgorod/veliky-novgorod-10.avif" data-pswp-width="960" data-pswp-height="1280">
                <img alt="Великий Новгород, изображение 10" src="images/travels/veliky-novgorod/veliky-novgorod-10.avif" width="960" height="1280" loading="lazy" decoding="async">
              </a>
              <p class="caption">Но вокруг этого здания всё равно лежало самое красивое покрытие площади. Кусама ставит лайк</p>
            </figure>
            <figure>
              <a href="images/travels/veliky-novgorod/veliky-novgorod-11.avif" data-pswp-width="1280" data-pswp-height="960">
                <img alt="Великий Новгород, изображение 11" src="images/travels/veliky-novgorod/veliky-novgorod-11.avif" width="1280" height="960" loading="lazy" decoding="async">
              </a>
              <p class="caption">По всему городу много красивых муралов</p>
            </figure> 

            <figure>
              <a href="images/travels/veliky-novgorod/veliky-novgorod-12.avif" data-pswp-width="1280" data-pswp-height="960">
                <img alt="Великий Новгород, изображение 12" src="images/travels/veliky-novgorod/veliky-novgorod-12.avif" width="1280" height="960" loading="lazy" decoding="async">
              </a>
              <p class="caption">Сам город небольшой. Все знаковые места рядом. Поэтому в одной минуте от вокзала есть мурал с туристической картой всего города. Красиво</p>
            </figure>

            <figure>
              <a href="images/travels/veliky-novgorod/veliky-novgorod-13.avif" data-pswp-width="1280" data-pswp-height="960">
                <img alt="Великий Новгород, изображение 13" src="images/travels/veliky-novgorod/veliky-novgorod-13.avif" width="1280" height="960" loading="lazy" decoding="async">
              </a>
              <p class="caption">CSS is hard. Это отреставрированные окна на территории Кремля. Мы не смогли понять, почему они такие</p>
            </figure>

            <figure>
              <a href="images/travels/veliky-novgorod/veliky-novgorod-15.avif" data-pswp-width="960" data-pswp-height="1280">
                <img alt="Великий Новгород, изображение 14" src="images/travels/veliky-novgorod/veliky-novgorod-15.avif" width="960" height="1280" loading="lazy" decoding="async">
              </a>
              <p class="caption">Памятник. Да, круговая композиция с сюжетом и динамикой кажется интересным решением. Особенно если мы знаете, что за герои стоят и какие исторические события они показывают. Но по моему лицу я думаю всё понятно.</p>
            </figure>
            <figure>
              <a href="images/travels/veliky-novgorod/veliky-novgorod-16.avif" data-pswp-width="960" data-pswp-height="1280">
                <img alt="Великий Новгород, изображение 15" src="images/travels/veliky-novgorod/veliky-novgorod-16.avif" width="960" height="1280" loading="lazy" decoding="async">
              </a>
              <p class="caption">Меня бесконечно восхищает факт, что в 21 веке мы можем прочитать текст на монете которой 1000 лет. Интересно как далеко назад мы ещё можем читать? 1500 лет? 2000 лет? 
              </p>
            </figure>
            <figure>
              <a href="images/travels/veliky-novgorod/veliky-novgorod-17.avif" data-pswp-width="960" data-pswp-height="1280">
                <img alt="Великий Новгород, изображение 16" src="images/travels/veliky-novgorod/veliky-novgorod-17.avif" width="960" height="1280" loading="lazy" decoding="async">
              </a>
              <p class="caption">Знамя на рубле так же были созданы 1000 лет назад. Уже тогда использовался всадник на коне и двухглавый орёл. (Может это распространенный факт, но я этого не знала)
              </p>
            </figure>
            <figure>
              <a href="images/travels/veliky-novgorod/veliky-novgorod-18.avif" data-pswp-width="960" data-pswp-height="1280">
                <img alt="Великий Новгород, изображение 17" src="images/travels/veliky-novgorod/veliky-novgorod-18.avif" width="960" height="1280" loading="lazy" decoding="async">
              </a>
              <p class="caption">Нет, это не Жан-Мишель Баския мимо пробегал. Это рисунок мальчика на бересте тоже около 1000 лет назад. Увеличеный в несколько раз и изготовленный из метала
              </p>
            </figure>
            <figure>
              <a href="images/travels/veliky-novgorod/veliky-novgorod-19.avif" data-pswp-width="960" data-pswp-height="1280">
                <img alt="Великий Новгород, изображение 18" src="images/travels/veliky-novgorod/veliky-novgorod-19.avif" width="960" height="1280" loading="lazy" decoding="async">
              </a>
              <p class="caption">Внутри музея много интерактивных развлечений. Объемные буквы. Викторины. Игры. Видео. Проекции. Большая часть из них реально интересные. Видно что не просто с душой сделано. А с душой ещё и талантливого человека</p>
            </figure>
            <figure>
              <a href="images/travels/veliky-novgorod/veliky-novgorod-20.avif" data-pswp-width="915" data-pswp-height="1280">
                <img alt="Великий Новгород, изображение 19" src="images/travels/veliky-novgorod/veliky-novgorod-20.avif" width="915" height="1280" loading="lazy" decoding="async">
              </a>
              <p class="caption"></p>
            </figure>
            <figure>
              <a href="images/travels/veliky-novgorod/veliky-novgorod-21.avif" data-pswp-width="915" data-pswp-height="1280">
                <img alt="Великий Новгород, изображение 20" src="images/travels/veliky-novgorod/veliky-novgorod-21.avif" width="915" height="1280" loading="lazy" decoding="async">
              </a>
              <p class="caption">Котик</p>
            </figure>
